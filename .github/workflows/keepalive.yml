# Backup keep-alive: ping Supabase every three days in case the Vercel cron ever stops.
# (The daily Vercel cron in vercel.json is the main one.)
name: keep-alive
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a heartbeat
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/heartbeat" \
            -H "apikey: $SUPABASE_KEY" -H "content-type: application/json" \
            -d '{"source":"github-actions"}'
